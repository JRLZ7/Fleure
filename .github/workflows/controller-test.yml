name: Controller test

on: [pull_request]

permissions:
  contents: read

jobs:
  controller-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build controller test
        run: c++ -std=c++11 -Wall -Wextra -Werror firmware/test/controller_test.cpp -o controller_test

      - name: Run controller test
        run: ./controller_test
